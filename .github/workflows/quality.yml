# Rôle : Contrôles automatiques de qualité de l’API.
name: Vérifications API
on:
  pull_request:
  push:
    branches: [main, chatbot, chore/audit-soutenance]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:cov
      - run: npm run test:e2e -- --runInBand
      - run: npm run build
